name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Scan tracked files
        run: ./scripts/check-secrets.sh

  web-quality:
    name: Web security, tests, lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        working-directory: apps/web
        run: npm ci
      - name: Audit production dependency tree
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
      - name: Run domain unit tests
        working-directory: apps/web
        run: npm test
      - name: Type-check application and domain contracts
        working-directory: apps/web
        run: npx tsc --noEmit -p tsconfig.json
      - name: Validate web application
        run: ./scripts/verify-web.sh

  database-quality:
    name: Database migrations, RLS and immutability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Add PostgreSQL tools to PATH
        run: echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - name: Run disposable local PostgreSQL verification
        run: ./supabase/tests/run-local-verification.sh

  vercel-preview-quality:
    name: Vercel preview build (Nitro adapter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        working-directory: apps/web
        run: npm ci
      - name: Build for Vercel and verify Build Output API v3 shape
        working-directory: apps/web
        run: npm run verify:vercel
